name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # .Rprofile activates renv; skip that in CI so install.packages uses
      # binary CRAN/RSPM packages instead of building from source.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('rsconnect','shiny','DT','readr','dplyr'), repos='https://packagemanager.posit.co/cran/__linux__/noble/latest')"

      - name: Configure rsconnect
        run: |
          Rscript -e "rsconnect::setAccountInfo(name=Sys.getenv('SHINYAPPS_ACCOUNT'), token=Sys.getenv('SHINYAPPS_TOKEN'), secret=Sys.getenv('SHINYAPPS_SECRET'))"

      - name: Deploy
        run: |
          Rscript scripts/deploy_shinyapps.R
